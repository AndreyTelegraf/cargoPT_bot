name: CargoPT critical checks

on:
  push:
  pull_request:

jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit pinned dependencies
        run: |
          python -m venv .pip-audit
          .pip-audit/bin/python -m pip install pip-audit==2.10.1
          .pip-audit/bin/python -m pip_audit \
            -r requirements.txt \
            --format json \
            --output pip-audit.json
      - name: Save dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn
      - name: Run critical suite
        env:
          PYTHON_BIN: python
          BOT_TOKEN: 123456:TESTTOKEN
          DATABASE_URL: sqlite+aiosqlite:///data/cargopt_dev.db
        run: scripts/run_critical_suite.sh
