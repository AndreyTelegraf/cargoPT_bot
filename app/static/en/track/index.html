<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoPT — track your request</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Private page for tracking the status of your CargoPT request.">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/cargopt-icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=tokens-v1">
  <link rel="stylesheet" href="/assets/css/components.css?v=carrier-profile-v1">
  <link rel="stylesheet" href="/assets/css/landing.css?v=reduced-motion-v2">
  <link rel="stylesheet" href="/assets/css/track.css?v=request-management-v1">
  <link rel="stylesheet" href="/assets/css/progress-header.css?v=progress-cancelled-stage-v5">
</head>
<body data-locale="en" class="tracking-page track-page-shell">
  <header class="site-header">
    <a class="logo" href="/en/" aria-label="CargoPT"><span class="logo-cargo">Cargo</span><span class="logo-pt">PT</span></a>
    <nav class="header-actions" aria-label="Navigation">
      <span class="locale-switcher"><button class="locale-current" type="button" aria-label="Choose language">EN</button><span class="locale-menu"><a href="/track/">PT</a><a href="/en/track/" aria-current="page">EN</a><a href="/ru/track/">RU</a></span></span>
      <button id="copyTrackingLink" class="button button-small button-header-action" type="button">Copy tracking link</button>
    </nav>
  </header>

  <main id="top">
    <section
      id="trackingProgressHeader"
      class="progress-header-shell"
      aria-label="Request progress"
    ></section>

    <section class="section track-workspace-shell">
      <aside
        id="otherRequestsPanel"
        class="track-workspace-sidebar"
        aria-label="Other requests"
        hidden
      >
        <h2 class="track-sidebar-title">Other requests</h2>
        <button
          id="otherRequestsToggle"
          class="track-other-requests-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="trackPedidosList"
        >
          Other requests
        </button>
        <div id="trackPedidosList" class="track-offer-nav-list"></div>
      </aside>

      <section id="trackingPanel" class="tracking-panel tracking-request-card" aria-label="Request offers">
        <div id="trackingPanelBody"></div>

        <section id="errorCard" class="track-card error-card" hidden>
          <p class="eyebrow">Error</p>
          <h2>Unable to load this request</h2>
          <p>Check that you opened the complete link. If the problem continues, contact CargoPT.</p>
        </section>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <strong class="footer-logo"><span class="logo-cargo">Cargo</span><span class="logo-pt">PT</span></strong>
    </div>
    <nav class="footer-links" aria-label="Legal information">
      <a href="/en/carriers/">Carriers</a>
      <a href="/en/privacy/">Privacy</a>
      <a href="/en/terms/">Terms</a>
      <a href="/en/cookies/">Cookies</a>
      <a href="mailto:hello@cargopt.pt">Contact</a>
    </nav>
  </footer>
  <script src="/assets/js/progress-header.js?v=progress-stage-v5" defer></script>
  <script src="/assets/js/tracking-workspace.js?v=request-management-v1" defer></script>
  <script src="/assets/js/track.js?v=request-management-v1" defer></script>
</body>
</html>
