<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoPT — статус вашей заявки</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Приватная страница для отслеживания статуса заявки CargoPT.">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/cargopt-icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=tokens-v1">
  <link rel="stylesheet" href="/assets/css/components.css?v=carrier-profile-v1">
  <link rel="stylesheet" href="/assets/css/landing.css?v=reduced-motion-v2">
  <link rel="stylesheet" href="/assets/css/track.css?v=request-management-v1">
  <link rel="stylesheet" href="/assets/css/progress-header.css?v=progress-cancelled-stage-v5">
</head>
<body data-locale="ru" class="tracking-page track-page-shell">
  <header class="site-header">
    <a class="logo" href="/ru/" aria-label="CargoPT"><span class="logo-cargo">Cargo</span><span class="logo-pt">PT</span></a>
    <nav class="header-actions" aria-label="Навигация">
      <span class="locale-switcher"><button class="locale-current" type="button" aria-label="Выбрать язык">RU</button><span class="locale-menu"><a href="/track/">PT</a><a href="/en/track/">EN</a><a href="/ru/track/" aria-current="page">RU</a></span></span>
      <button id="copyTrackingLink" class="button button-small button-header-action" type="button">Скопировать ссылку</button>
    </nav>
  </header>

  <main id="top">
    <section
      id="trackingProgressHeader"
      class="progress-header-shell"
      aria-label="Ход выполнения заявки"
    ></section>

    <section class="section track-workspace-shell">
      <aside
        id="otherRequestsPanel"
        class="track-workspace-sidebar"
        aria-label="Другие заявки"
        hidden
      >
        <h2 class="track-sidebar-title">Другие заявки</h2>
        <button
          id="otherRequestsToggle"
          class="track-other-requests-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="trackPedidosList"
        >
          Другие заявки
        </button>
        <div id="trackPedidosList" class="track-offer-nav-list"></div>
      </aside>

      <section id="trackingPanel" class="tracking-panel tracking-request-card" aria-label="Предложения по заявке">
        <div id="trackingPanelBody"></div>

        <section id="errorCard" class="track-card error-card" hidden>
          <p class="eyebrow">Ошибка</p>
          <h2>Не удалось загрузить заявку</h2>
          <p>Проверьте, что вы открыли полную ссылку. Если проблема сохраняется, свяжитесь с CargoPT.</p>
        </section>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <strong class="footer-logo"><span class="logo-cargo">Cargo</span><span class="logo-pt">PT</span></strong>
    </div>
    <nav class="footer-links" aria-label="Юридическая информация">
      <a href="/ru/carriers/">Перевозчикам</a>
      <a href="/ru/privacy/">Конфиденциальность</a>
      <a href="/ru/terms/">Условия</a>
      <a href="/ru/cookies/">Cookies</a>
      <a href="mailto:hello@cargopt.pt">Контакты</a>
    </nav>
  </footer>
  <script src="/assets/js/progress-header.js?v=progress-stage-v5" defer></script>
  <script src="/assets/js/tracking-workspace.js?v=request-management-v1" defer></script>
  <script src="/assets/js/track.js?v=request-management-v1" defer></script>
</body>
</html>
